<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع خالد ثائر رشيد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #00bcd4; }
        p { color: #b0bec5; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background: linear-gradient(45deg, #00bcd4, #2196f3);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.4);
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .info-box { text-align: right; margin-top: 10px; }
        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 14px;
            border-right: 4px solid #00bcd4;
        }
        .info-item span { color: #80deea; font-weight: bold; }
        
        #secret-three {
            cursor: pointer;
            color: inherit;
            text-decoration: none;
            font-weight: normal;
        }

        .social-title {
            font-size: 15px;
            color: #80deea;
            margin: 15px 0 10px 0;
            text-align: right;
            font-weight: bold;
        }
        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s, transform 0.2s;
        }
        .social-card:hover {
            background: rgba(0, 188, 212, 0.2);
            transform: translateX(-3px);
        }
        .social-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .social-info i {
            font-size: 22px;
            color: #00bcd4;
            width: 25px;
            text-align: center;
        }
        .social-name { font-size: 14px; font-weight: bold; }
        .social-handle { font-size: 12px; color: #b0bec5; }
        
        .back-btn { background: rgba(255, 255, 255, 0.1); margin-top: 20px; width: 100%; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #00bcd4;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 188, 212, 0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00bcd4;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s;
        }
        .cell:hover { background: rgba(0, 188, 212, 0.2); }
        .game-status { font-size: 14px; color: #80deea; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="welcomeScreen">
            <h1>مرحباً بك في موقعي الشخصي</h1>
            <p>أهلاً بك، أنا خالد ثائر رشيد. انقر بالأسفل لعرض ملفي الشخصي.</p>
            <button class="btn" onclick="showInfo()">معلومات عني</button>
        </div>

        <div id="infoScreen" style="display:none;">
            <h1>خالد ثائر رشيد</h1>
            <p>بطاقة التعريف الشخصية</p>
            
            <div class="info-box">
                <div class="info-item">
                    <span>البريد الإلكتروني:</span><br>
                    khald1mk0@gmail.com
                </div>
                <div class="info-item">
                    <span>رقم الهاتف:</span><br>
                    0780<span id="secret-three">3</span>494710
                </div>

                <div class="social-title">روابط التواصل:</div>
                <div class="social-grid">
                    <a href="https://instagram.com/vp_e1" target="_blank" class="social-card">
                        <div class="social-info">
                            <i class="fa-brands fa-instagram"></i>
                            <div>
                                <div class="social-name">Instagram</div>
                                <div class="social-handle">@vp_e1</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:12px; color:#b0bec5;"></i>
                    </a>

                    <a href="https://tiktok.com/@vb_e11" target="_blank" class="social-card">
                        <div class="social-info">
                            <i class="fa-brands fa-tiktok"></i>
                            <div>
                                <div class="social-name">TikTok</div>
                                <div class="social-handle">@vb_e11</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:12px; color:#b0bec5;"></i>
                    </a>

                    <a href="https://discord.com/users/vb_e" target="_blank" class="social-card">
                        <div class="social-info">
                            <i class="fa-brands fa-discord"></i>
                            <div>
                                <div class="social-name">Discord</div>
                                <div class="social-handle">vb_e</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:12px; color:#b0bec5;"></i>
                    </a>
                </div>
            </div>

            <button class="btn back-btn" onclick="goBack()">رجوع</button>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h2>🎮 كشفت السر!</h2>
            <p class="game-status" id="gameStatus">دورك باللعب (X)</p>
            <div class="board" id="board">
                <div class="cell" onclick="makeMove(0)"></div>
                <div class="cell" onclick="makeMove(1)"></div>
                <div class="cell" onclick="makeMove(2)"></div>
                <div class="cell" onclick="makeMove(3)"></div>
                <div class="cell" onclick="makeMove(4)"></div>
                <div class="cell" onclick="makeMove(5)"></div>
                <div class="cell" onclick="makeMove(6)"></div>
                <div class="cell" onclick="makeMove(7)"></div>
                <div class="cell" onclick="makeMove(8)"></div>
            </div>
            <button class="btn" onclick="resetGame()">إعادة اللعب</button>
            <button class="btn back-btn" onclick="closeGame()" style="margin-top:10px;">إغلاق</button>
        </div>
    </div>

    <script>
        function showInfo() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('infoScreen').style.display = 'block';
        }
        function goBack() {
            document.getElementById('infoScreen').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'block';
        }

        let boardState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        document.getElementById('secret-three').addEventListener('click', () => {
            document.getElementById('gameModal').style.display = 'flex';
            resetGame();
        });

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function makeMove(index) {
            if (boardState[index] !== "" || !gameActive) return;

            boardState[index] = "X";
            renderBoard();

            if (checkWinner("X")) {
                document.getElementById('gameStatus').innerText = "🎉 مبروك! لقد فزت!";
                gameActive = false;
                return;
            }

            if (boardState.every(cell => cell !== "")) {
                document.getElementById('gameStatus').innerText = "🤝 تعادل!";
                gameActive = false;
                return;
            }

            document.getElementById('gameStatus').innerText = "يفكر الكمبيوتر...";
            setTimeout(botMove, 400);
        }

        function botMove() {
            if (!gameActive) return;
            let emptyCells = boardState.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;

            let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            boardState[randomIndex] = "O";
            renderBoard();

            if (checkWinner("O")) {
                document.getElementById('gameStatus').innerText = "🤖 فاز الكمبيوتر!";
                gameActive = false;
            } else if (boardState.every(cell => cell !== "")) {
                document.getElementById('gameStatus').innerText = "🤝 تعادل!";
                gameActive = false;
            } else {
                document.getElementById('gameStatus').innerText = "دورك باللعب (X)";
            }
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, idx) => {
                cell.innerText = boardState[idx];
                cell.style.color = boardState[idx] === "X" ? "#00bcd4" : "#ff4081";
            });
        }

        function checkWinner(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => {
                return pattern.every(idx => boardState[idx] === player);
            });
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            document.getElementById('gameStatus').innerText = "دورك باللعب (X)";
            renderBoard();
        }
    </script>
</body>
</html>
