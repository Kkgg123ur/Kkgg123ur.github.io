<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خالد ثائر رشيد</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #a855f7;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .profile-card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      color: var(--text-main);
    }
    .info-list {
      margin: 20px 0;
      text-align: right;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .info-item {
      margin-bottom: 8px;
      color: var(--text-sub);
    }
    .info-item span {
      color: var(--text-main);
      font-weight: bold;
    }
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      display: block;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: opacity 0.3s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-tiktok { background-color: #000000; border: 1px solid #333; }
    .btn-discord { background-color: #5865F2; }
  </style>
</head>
<body>

  <div class="profile-card">
    <h1>خالد ثائر رشيد</h1>
    
    <div class="info-list">
      <div class="info-item">📧 البريد: <span>khald1mk0@gmail.com</span></div>
      <div class="info-item">📞 الهاتف: <span>07803494710</span></div>
    </div>

    <div class="social-links">
      <a href="https://instagram.com/vb_e1" target="_blank" class="btn btn-insta">انستغرام (@vb_e1)</a>
      <a href="https://tiktok.com/@vp_e11" target="_blank" class="btn btn-tiktok">تيك توك (@vp_e11)</a>
      <a href="https://discord.com" target="_blank" class="btn btn-discord">ديسكورد (vb_e)</a>
    </div>
  </div>

</body>
</html>
