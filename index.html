<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خالد ثائر رشيد</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #171026 100%);
      --card-bg: rgba(26, 27, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #a855f7;
    }
    
    * {
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* شاشات الانتقال */
    .screen {
      position: absolute;
      width: 90%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      pointer-events: none;
    }

    .screen.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* شاشة الترحيب */
    .welcome-screen h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(to right, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-screen p {
      color: var(--text-sub);
      margin-bottom: 30px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .action-btn {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
      width: 100%;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
    }

    /* شاشة المعلومات */
    .profile-screen h2 {
      margin: 0 0 5px;
      font-size: 1.6rem;
    }

    .job-title {
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .info-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: right;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .info-item {
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-item span {
      color: var(--text-main);
      font-weight: 500;
      direction: ltr;
    }

    /* أزرار السوشيال ميديا الاحترافية */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .social-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.05);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .social-btn:hover::before {
      opacity: 1;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* ألوان دقيقة ومميزة لكل منصة */
    .btn-insta { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .btn-tiktok { background: #000000; border-color: #333; }
    .btn-discord { background: #5865F2; }

    .social-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social-arrow {
      font-size: 0.8rem;
      opacity: 0.8;
      transition: transform 0.3s;
    }

    .social-btn:hover .social-arrow {
      transform: translateX(-4px);
    }

    /* زر العودة */
    .back-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      margin-top: 18px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .back-btn:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- شاشة الترحيب الأولى -->
    <div class="screen welcome-screen active" id="welcomeScreen">
      <h1>مرحباً بك 👋</h1>
      <p>اضغط أدناه للدخول إلى بطاقتي الشخصية ومعلومات التواصل الخاصة بي</p>
      <button class="action-btn" onclick="showProfile()">دخول للموقع 🚀</button>
    </div>

    <!-- شاشة المعلومات الشخصية -->
    <div class="screen profile-screen" id="profileScreen">
      <h2>خالد ثائر رشيد</h2>
      <div class="job-title">صفحة التواصل الشخصية</div>

      <div class="info-box">
        <div class="info-item">البريد الإلكتروني: <span>khald1mk0@gmail.com</span></div>
        <div class="info-item">رقم الهاتف: <span style="direction: ltr;">+964 780 349 4710</span></div>
      </div>

      <div class="social-links">
        <!-- انستغرام -->
        <a href="https://instagram.com/vb_e1" target="_blank" class="social-btn btn-insta">
          <div class="social-info">
            <span>📸 انستغرام</span>
          </div>
          <span style="direction: ltr; font-size: 0.85rem; opacity: 0.9;">@vb_e1</span>
        </a>

        <!-- تيك توك -->
        <a href="https://tiktok.com/@vp_e11" target="_blank" class="social-btn btn-tiktok">
          <div class="social-info">
            <span>🎬 تيك توك</span>
          </div>
          <span style="direction: ltr; font-size: 0.85rem; opacity: 0.9;">@vp_e11</span>
        </a>

        <!-- ديسكورد -->
        <a href="https://discord.com" target="_blank" class="social-btn btn-discord">
          <div class="social-info">
            <span>💬 ديسكورد</span>
          </div>
          <span style="direction: ltr; font-size: 0.85rem; opacity: 0.9;">vb_e</span>
        </a>
      </div>

      <button class="back-btn" onclick="showWelcome()">← العودة لشاشة الترحيب</button>
    </div>

  </div>

  <script>
    const welcomeScreen = document.getElementById('welcomeScreen');
    const profileScreen = document.getElementById('profileScreen');

    function showProfile() {
      welcomeScreen.classList.remove('active');
      profileScreen.classList.add('active');
    }

    function showWelcome() {
      profileScreen.classList.remove('active');
      welcomeScreen.classList.add('active');
    }
  </script>

</body>
</html>
